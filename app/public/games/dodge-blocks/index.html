<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=320, initial-scale=1.0" />
  <title>Dodge the Blocks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="game-side-layout">
      <div class="game-panel">
        <h1>Dodge the Blocks</h1>
        <canvas id="game" width="320" height="480"></canvas>
        <div class="controls">
          <button id="restart">Restart</button>
        </div>
      </div>
      <div class="how-to-play">
        <h2>How to Play</h2>
        <ul>
          <li>Use <b>Left</b> and <b>Right</b> arrow keys to move.</li>
          <li>Avoid falling blocks as long as you can.</li>
          <li>Press <b>Restart</b> to play again.</li>
        </ul>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
