# Dependabot configuration for automatic dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Enable version updates for npm (JavaScript/TypeScript projects)
  # Includes both regular updates and security updates
  - package-ecosystem: 'npm'
    directory: '/app'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    reviewers:
      - 'nitsuah'
    assignees:
      - 'nitsuah'
    labels:
      - 'dependencies'
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # @react-three/fiber@9.7.0 (latest stable) peer-caps react at ">=19 <19.3",
      # and @react-three/drei re-asserts the same range. Unpin once fiber ships
      # a stable 10.x with React 19.3 support — see #338.
      - dependency-name: 'react'
        versions:
          - '>=19.3.0'
      - dependency-name: 'react-dom'
        versions:
          - '>=19.3.0'
      - dependency-name: '@types/react'
        versions:
          - '>=19.3.0'
      - dependency-name: '@types/react-dom'
        versions:
          - '>=19.3.0'
    commit-message:
      prefix: 'chore(deps)'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'nitsuah'
    labels:
      - 'dependencies'
      - 'github-actions'
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
