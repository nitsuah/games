name: Games CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to checkout code
      actions: write  # Required for uploading build artifacts
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: app/package.json
        
    - name: Install dependencies
      run: |
        cd app
        npm ci
    
    - name: Install Playwright browsers
      run: |
        cd app
        npx playwright install --with-deps chromium
    
    - name: Run type checking
      run: |
        cd app
        npm run type-check

    - name: Run tests
      run: |
        cd app
        # Use the CI-specific test script to avoid interactive watch mode
        npm run test:ci --if-present
    
    - name: Check color contrast
      run: |
        cd app
        node scripts/contrast-check.js
      continue-on-error: true
        
    - name: Build application
      run: |
        cd app
        npm run build
    
    - name: Run E2E tests
      run: |
        cd app
        # Use a static server for E2E tests since we are using 'output: export'
        npx http-server out -p 3000 &
        # Use wait-on to ensure server is ready before running tests
        npx wait-on http://localhost:3000 --timeout 60000
        npm run test:e2e
      continue-on-error: false
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: build-files
        path: app/out/
        
  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write  # Required for peaceiris/actions-gh-pages to push to gh-pages branch
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: app/package.json
        
    - name: Install dependencies
      run: |
        cd app
        npm ci
        
    - name: Build for deployment
      run: |
        cd app
        npm run build
        npm run export --if-present
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@e9c66a37f080288a11235e32cbe2dc5fb3a679cc # v4.0.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: app/out
        
  performance-audit:
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to checkout code
      actions: write  # Required for uploading audit artifacts
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: |
        cd app
        npm ci
        
    - name: Build application
      run: |
        cd app
        npm run build
        npx http-server out -p 3000 &
        npx wait-on http://localhost:3000 --timeout 60000
        
    - name: Run Lighthouse audit
      uses: treosh/lighthouse-ci-action@03becbfc543944dd6e7534f7ff768abb8a296826 # v10.1.0
      with:
        configPath: './.lighthouserc.json'
        # Disable the action's built-in artifact upload to avoid artifact-name errors
        # We will replace this with an explicit upload step that uses a safe artifact
        # name (e.g. lhci-results-${{ github.run_id }}) in a follow-up change.
        uploadArtifacts: false
        temporaryPublicStorage: true
    - name: Upload Lighthouse artifacts (safe)
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: lhci-results-${{ github.run_id }}
        path: |
          app/.lighthouseci
          app/lighthouse-report
          app/lhci-report
      # Make this step non-fatal while we validate artifact paths
      continue-on-error: true