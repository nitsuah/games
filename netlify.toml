[build]
  # The base directory where the build commands should be run
  base = "app"
  
  # The build command to run
  command = "npm run build"
  
  # The directory to deploy - Next.js outputs to .next for SSR
  publish = ".next"

[build.environment]
  # Set Node.js version
  NODE_VERSION = "22.21.0"
  
  # Next.js environment variables
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js plugin for Netlify (provides build optimizations and caching)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Headers for better security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/games/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/sounds/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
